<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tarot – Bốc bài &amp; diễn giải</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#120d1f;--card:#1e1535;--gold:#e8c777;--tx:#efe9ff;--mu:#a99cc9;--ac:#7c5cff}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at top,#2a1b4d,var(--bg) 60%);color:var(--tx);font-family:Georgia,"Times New Roman",serif;min-height:100vh}
main{max-width:1000px;margin:auto;padding:24px 16px 60px}
h1{text-align:center;color:var(--gold);letter-spacing:2px;margin:8px 0}
.sub{text-align:center;color:var(--mu);margin-bottom:20px}
.panel{background:var(--card);border:1px solid #3a2c63;border-radius:14px;padding:16px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:center}
input[type=text],select{background:#120d1f;color:var(--tx);border:1px solid #4a3a7a;border-radius:8px;padding:9px;font-size:15px}
input[type=text]{flex:1 1 220px}
button{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:10px 20px;font-size:16px;cursor:pointer}
button:hover{filter:brightness(1.15)}
button.ghost{background:transparent;border:1px solid var(--gold);color:var(--gold)}
label{color:var(--mu);font-size:14px}
#table{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:18px;margin:26px 0}
.slot{perspective:900px;text-align:center}
.pos{color:var(--mu);font-size:13px;margin-bottom:6px}
.flip{position:relative;height:250px;transform-style:preserve-3d;transition:transform .8s;cursor:pointer}
.flip.open{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px;border:2px solid var(--gold)}
.back{background:repeating-linear-gradient(45deg,#3b2a73,#3b2a73 8px,#2a1d54 8px,#2a1d54 16px);font-size:42px;color:var(--gold)}
.front{transform:rotateY(180deg);background:linear-gradient(160deg,#f6ecd0,#d9c08a);color:#2b1d12}
.front .ic{font-size:44px}.front .nm{font-weight:bold;margin-top:8px}.front .en{font-size:12px;opacity:.7}
.front.rev .inner{transform:rotate(180deg)}
.inner{display:flex;flex-direction:column;align-items:center;text-align:center}
.tag{margin-top:6px;font-size:12px;background:#2b1d12;color:var(--gold);padding:2px 8px;border-radius:10px}
#reading .item{background:var(--card);border-left:4px solid var(--gold);border-radius:10px;padding:12px 16px;margin:12px 0}
#reading h3{margin:0 0 4px;color:var(--gold)}
#reading .k{color:var(--mu);font-size:14px}
.sum{background:#2a1b4d;border:1px solid var(--gold);border-radius:12px;padding:14px 18px;margin-top:20px;line-height:1.6}
details{margin-top:34px;background:var(--card);border-radius:12px;padding:12px 16px}
summary{cursor:pointer;color:var(--gold);font-size:18px}
table{width:100%;border-collapse:collapse;font-size:14px;margin-top:10px}
td,th{border-bottom:1px solid #3a2c63;padding:6px;text-align:left;vertical-align:top}
th{color:var(--gold)}
footer{text-align:center;color:var(--mu);font-size:12px;margin-top:30px}
body{font-family:"Be Vietnam Pro","Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.55}
h1,#reading h3,summary{font-family:"Playfair Display","Be Vietnam Pro",serif}
h1{font-size:44px;letter-spacing:8px}
.face{-webkit-backface-visibility:hidden}
.flip{height:290px;-webkit-transform-style:preserve-3d}
svg{width:1em;height:1em;display:block}
.back{color:var(--gold)}.back svg{width:56px;height:56px}
.front{padding:14px 10px;box-shadow:inset 0 0 0 5px #f6ecd0,inset 0 0 0 6px #b99a58}
.front .ic{font-size:54px;color:#7a5a1e;display:flex;justify-content:center}
.front .nm{font-family:"Playfair Display",serif;font-size:19px;line-height:1.25;margin-top:14px}
.front .en{font-size:12px;margin-top:6px;letter-spacing:.5px}
.li{display:inline-block;width:1.1em;height:1.1em;vertical-align:-3px;color:var(--gold)}
#reading .m{margin:4px 0;color:var(--mu)}#reading .m.on{color:var(--tx)}
#reading .k{font-size:13px}
button,input,select{font-family:inherit}
td,th{padding:8px 6px}
.img{font-style:italic;color:var(--mu);font-size:14px;margin:6px 0}#reading .adv{color:var(--gold)}
.vd{display:inline-block;font-weight:700;font-size:20px;padding:4px 16px;border-radius:20px;margin:6px 0;background:#3a2c63}.vd.Y{background:#1f6b45}.vd.N{background:#8a2f3d}.vd.M{background:#7a6420}
</style>
</head>
<body>
<main>
<h1>TAROT</h1>
<div class="sub">Tập trung vào câu hỏi của bạn, chọn số lá rồi bốc bài</div>
<div class="panel">
  <input type="text" id="q" placeholder="Câu hỏi của bạn (không bắt buộc)">
  <label>Chủ đề: <select id="tp"><option value="all">Tổng quát</option><option value="love">Tình yêu</option><option value="work">Công việc</option><option value="study">Học tập</option><option value="dir">Định hướng</option><option value="yn">Yes / No</option><option value="adv">Lời khuyên</option></select></label>
  <label>Số lá: <select id="n"></select></label>
  <label><input type="checkbox" id="rv" checked> Cho phép lá ngược</label>
  <button id="go">Bốc bài</button>
  <button class="ghost" id="all" style="display:none">Lật tất cả</button>
</div>
<div id="table"></div>
<div id="reading"></div>
<details>
  <summary>Thư viện đủ 78 lá</summary>
  <table id="lib"></table>
</details>
<footer>Nội dung theo bộ Rider–Waite–Smith, đối chiếu với sách The Pictorial Key to the Tarot (A.E. Waite, 1910). Tarot mang tính tham khảo, giải trí và tự soi chiếu, không thay thế lời khuyên chuyên môn.</footer>
</main>
<script>
// Đại Bí (22): EN|VN|Hình ảnh|Xuôi|Ngược|Tình cảm|Công việc|Lời khuyên
const MAJ=`The Fool|Chàng Khờ|Chàng trai trẻ sắp bước khỏi mép vách đá, vai mang túi nhỏ, tay cầm hoa trắng, chú chó bên chân, mặt trời phía sau.|Bước đầu của một hành trình. Lá của sự khởi đầu, niềm tin ngây thơ và sự sẵn sàng nhảy vào điều chưa biết. Waite ghi nghĩa cổ là sự dại khờ, bốc đồng; cách hiểu hiện đại là can đảm làm điều mới.|Thiếu suy xét, bất cẩn, liều lĩnh vô trách nhiệm; hoặc ngược lại, sợ hãi không dám bắt đầu dù cơ hội đang ở trước mắt.|Mối quan hệ mới đầy hứng khởi, nhưng tránh lao vào quá vội.|Cơ hội mới, hướng đi mới; cần cân nhắc rủi ro.|Tin vào bước đầu tiên, nhưng nhìn đường trước khi nhảy.
The Magician|Nhà Ảo Thuật|Một người một tay giơ gậy lên trời, tay kia chỉ xuống đất, trước mặt là bàn có đủ biểu tượng bốn bộ bài, trên đầu có dấu vô cực.|Bạn đã có đủ công cụ (Gậy, Cốc, Kiếm, Tiền) và biết mình muốn gì. Lá của ý chí, kỹ năng, sự tập trung nối trời với đất để biến ý tưởng thành hiện thực. Nghĩa cổ: khéo léo, ngoại giao, tự tin.|Tài năng không được dùng đúng chỗ, thiếu tập trung; hoặc dùng sự khéo léo để lừa dối, thao túng.|Sức hút và sự chủ động; cẩn thận lời đường mật thiếu thật lòng.|Thời điểm khởi nghiệp, trình bày ý tưởng, dùng hết kỹ năng.|Bạn đã có đủ nguồn lực, hãy bắt tay vào làm.
The High Priestess|Nữ Tư Tế|Nữ tư tế ngồi giữa hai cột đen trắng, cuộn kinh trên tay, tấm màn thạch lựu phía sau, trăng lưỡi liềm dưới chân.|Tiếng nói của trực giác và tiềm thức. Có điều chưa được nói ra hoặc chưa hiện rõ; hãy lắng nghe, chờ đợi và quan sát. Waite xem đây là tầng nghĩa sâu, bí truyền của những điều bí ẩn.|Phớt lờ trực giác, bí mật bị phơi bày, hoặc dựa vào suy đoán thay vì sự thật.|Cảm xúc sâu chưa nói thành lời; cần sự tin cậy lặng lẽ.|Chưa nên vội hành động, cần thêm thông tin.|Im lặng một chút, câu trả lời đã ở trong bạn.
The Empress|Hoàng Hậu|Người phụ nữ ngồi trên ghế đệm giữa cánh đồng lúa chín, đội vương miện mười hai sao, khiên hình trái tim.|Sự sung túc, nuôi dưỡng và sức sáng tạo của thiên nhiên. Tình yêu thương, ý tưởng đang thai nghén, đời sống đủ đầy về giác quan. Waite gắn lá này với sự phong nhiêu.|Phụ thuộc, ôm đồm chăm sóc người khác mà quên bản thân, bế tắc sáng tạo, hoặc buông thả.|Tình cảm ấm áp, gắn bó; có thể liên quan đến gia đình, con cái.|Dự án đang lớn lên, cần được chăm chút đều đặn.|Chăm bản thân như cách bạn chăm điều mình yêu.
The Emperor|Hoàng Đế|Vị vua ngồi ngai đá khắc đầu cừu, tay cầm quyền trượng ankh và quả cầu, núi đá phía sau.|Quyền lực, trật tự, cấu trúc và sự bảo vệ. Người lãnh đạo có kỷ luật, đặt quy tắc rõ ràng và chịu trách nhiệm.|Độc đoán, cứng nhắc, lạm quyền; hoặc thiếu kỷ luật, khó tự lập.|Mối quan hệ cần ổn định, rõ ràng; coi chừng sự kiểm soát.|Lập kế hoạch, thiết lập hệ thống, nhận vai trò dẫn dắt.|Đặt khung rõ ràng, nhưng đừng quá cứng.
The Hierophant|Giáo Hoàng|Giáo chủ ngồi giữa hai trụ, tay giơ ban phước, hai người quỳ trước mặt, hai chìa khóa bắt chéo.|Truyền thống, giáo dục, hệ giá trị chung và sự dẫn dắt của người thầy. Học theo cách đã được kiểm chứng, hòa vào cộng đồng, tìm ý nghĩa tinh thần.|Phá khuôn mẫu, nghi ngờ tín điều, tự tìm đường riêng; hoặc bị trói buộc bởi lề thói lỗi thời.|Cam kết, nghi lễ (đính hôn, cưới hỏi), quan niệm gia đình.|Học chính quy, có người hướng dẫn, làm theo quy trình.|Học từ người đi trước, rồi chọn điều hợp với mình.
The Lovers|Tình Nhân|Một nam một nữ đứng dưới thiên thần, sau người nữ là cây có rắn, sau người nam là cây lửa.|Tình yêu và sự hòa hợp, nhưng cốt lõi là lựa chọn dựa trên giá trị thật của bản thân. Waite nhấn mạnh lá này còn có tầng nghĩa cao hơn chuyện đôi lứa.|Mất cân bằng, bất hòa, lựa chọn trái giá trị, trì hoãn quyết định quan trọng.|Kết nối sâu và cam kết; hoặc khủng hoảng cần nói thật.|Đối tác hợp giá trị, quyết định nghề nghiệp lớn.|Chọn điều đúng với bạn, không phải điều dễ nhất.
The Chariot|Cỗ Xe|Chiến binh đứng trong cỗ xe dưới tán sao, hai nhân sư đen trắng phía trước, không cầm dây cương.|Chiến thắng nhờ ý chí và kỷ luật; điều khiển hai lực đối lập cùng đi một hướng. Tiến lên có mục tiêu, vượt chướng ngại.|Mất phương hướng, thiếu kiểm soát, hung hăng, hoặc bị lực bên ngoài kéo đi.|Chủ động theo đuổi; hai người cần chung hướng đi.|Dồn sức cho mục tiêu, thăng tiến, chuyến đi công tác.|Giữ hướng nhìn, đừng để các lực kéo tách bạn ra.
Strength|Sức Mạnh|Người phụ nữ nhẹ nhàng đặt tay lên hàm sư tử, trên đầu có dấu vô cực.|Sức mạnh đến từ kiên nhẫn, lòng trắc ẩn và sự tự chủ; chế ngự bản năng bằng sự dịu dàng chứ không cưỡng ép.|Tự ti, nghi ngờ bản thân, để cảm xúc hoặc bản năng lấn át; hoặc dùng sức mạnh thô bạo.|Kiên nhẫn, bao dung với người thương và với chính mình.|Giữ bình tĩnh dưới áp lực, thuyết phục thay vì ép.|Mềm mà vững.
The Hermit|Ẩn Sĩ|Cụ già cầm đèn có ngôi sao sáu cánh, chống gậy, đứng trên đỉnh núi tuyết.|Rút về để tự vấn và tìm sự thật bên trong; ngọn đèn soi đường cho mình và cho người sau. Waite coi đây là lá của sự thấu hiểu, không chỉ là cô độc.|Cô lập quá mức, trốn tránh; hoặc từ chối lời khuyên; cũng có thể là kết thúc giai đoạn ở một mình.|Cần thời gian riêng để hiểu mình trước khi bước vào quan hệ.|Nghiên cứu sâu, làm việc độc lập, tìm người cố vấn.|Dành chút thời gian yên tĩnh để nghe tiếng nói bên trong.
Wheel of Fortune|Bánh Xe Số Phận|Bánh xe có chữ và ký hiệu, xung quanh là bốn sinh vật có cánh, rắn bên dưới, nhân sư bên trên.|Chu kỳ xoay vần: lúc lên, lúc xuống. Bước ngoặt, vận may và duyên số đến; nhắc rằng không gì tồn tại mãi.|Gặp trắc trở, chống lại thay đổi, cảm giác kẹt trong vòng lặp.|Duyên số gặp gỡ hoặc giai đoạn đổi thay.|Thay đổi bất ngờ, cơ hội; thị trường biến động.|Thích nghi với dòng chảy, tận dụng lúc lên.
Justice|Công Lý|Người ngồi ngai cầm gươm thẳng đứng và cán cân, đội vương miện, màn che phía sau.|Công bằng, sự thật và nhân quả: mỗi hành động đều có hệ quả. Cần quyết định dựa trên lẽ phải và sự rõ ràng.|Bất công, né tránh trách nhiệm, thiên vị, hoặc kết quả chưa như mong đợi.|Đối xử công bằng, nói thật; chuyện pháp lý hôn nhân.|Hợp đồng, giấy tờ, pháp lý; quyết định công tâm.|Nhìn mọi mặt trước khi quyết định.
The Hanged Man|Người Treo Ngược|Người đàn ông treo ngược bằng một chân trên cây chữ T, hào quang quanh đầu, gương mặt bình thản.|Tạm dừng và buông bỏ có chủ ý để thấy từ góc nhìn mới. Hy sinh nhỏ để đạt giá trị lớn hơn; chờ đúng lúc.|Trì hoãn vô ích, hy sinh không đáng, kháng cự bài học.|Nhìn mối quan hệ theo cách khác, đừng ép.|Dự án đình trệ tạm thời, cần đổi cách tiếp cận.|Đừng vội hành động, hãy đổi góc nhìn.
Death|Thần Chết|Bộ xương cưỡi ngựa trắng cầm cờ hoa hồng trắng; nhà vua ngã xuống, mặt trời mọc giữa hai tháp.|Kết thúc để mở ra chương mới. Hiếm khi là cái chết thật; thường là chuyển hóa sâu, buông điều đã hết vai trò. Waite ghi nhận cả nghĩa thay đổi và chuyển hóa.|Sợ đổi thay, níu kéo thứ đã qua, trì trệ kéo dài.|Khép lại một giai đoạn để tái sinh.|Đổi nghề, kết thúc dự án cũ.|Để cái cũ ra đi, chỗ trống sẽ có thứ mới.
Temperance|Tiết Chế|Thiên thần một chân trong nước, một chân trên đất, rót nước qua lại giữa hai chiếc cốc, đường mòn dẫn tới ánh sáng.|Cân bằng, điều độ, kiên nhẫn và hòa trộn các mặt đối lập. Tiến chậm mà chắc, tìm trung đạo.|Mất cân bằng, thái quá, thiếu kiên nhẫn, xung đột nội tâm.|Hòa hợp, nhường nhịn đôi bên.|Phối hợp nhịp nhàng, tránh làm quá sức.|Đừng cực đoan, thêm chút kiên nhẫn.

function topicText(d,t){
 const c=d.c,pl=pol(d),m=d.r?c.rv:c.up,up=c.maj&&!d.r;
 const ad=`<p class="m adv"><b>Lời khuyên:</b> ${ADV[c.id][d.r?1:0]}</p>`;
 if(t==="yn")return `<p class="vd ${pl}">${VD[pl]}</p><p class="m on"><b>${d.r?"Nghĩa ngược":"Nghĩa xuôi"}:</b> ${m}</p>`+ad;
 if(t==="adv")return `<p class="m on"><b>Ý nghĩa lá:</b> ${m}</p>`+ad;
 const own=up&&t==="love"?c.love:up&&t==="work"?c.work:m;
 const lens=c.maj?"Đây là lá Đại Bí nên chủ đề này mang tính bước ngoặt, đáng được coi trọng.":SL[t][c.suit];
 return `<p class="m on"><b>${TPN[t]}:</b> ${FR[t][pl]} ${lens}</p><p class="m on">${own}</p>`+ad;
}
function tsum(t){
 const n=drawn.length,pl=drawn.map(pol),y=pl.filter(x=>x==="Y").length,no=pl.filter(x=>x==="N").length,m=n-y-no,v=y>no?"Y":no>y?"N":"M";
 if(t==="yn")return `<div class="sum"><b>Kết luận Yes/No:</b> ${y} lá nghiêng về CÓ, ${no} lá nghiêng về KHÔNG, ${m} lá chưa rõ. Xu hướng chung: <b>${VD[v]}</b>. Đây chỉ là xu hướng tham khảo; câu hỏi nên rõ ràng dạng có/không và nên bốc ít lá.</div>`;
 const tone=v==="Y"?"nghiêng về thuận lợi":v==="N"?"có nhiều trở ngại cần lưu ý":"cân bằng giữa cơ hội và thử thách";
 return `<div class="sum"><b>Tổng quan ${TPN[t].toLowerCase()}:</b> ${y} lá thuận, ${no} lá trở ngại, ${m} lá cần cân nhắc: tình hình ${tone}. ${PADV[v]}</div>`;
}
const SV={wand:'<path d="M5 19L17 7"/><path d="M13 3c3 1 6 4 8 8-4-1-7-4-8-8z"/>',cup:'<path d="M6 4h12v5a6 6 0 0 1-12 0z"/><path d="M12 15v5M8 20h8"/>',sword:'<path d="M12 2v14"/><path d="M7 16h10"/><path d="M12 16v6"/>',pent:'<circle cx="12" cy="12" r="9.5"/><path d="M12 4.5L16.4 18L4.9 9.7H19.1L7.6 18Z"/>',maj:'<path d="M12 2l2.5 7.5L22 12l-7.5 2.5L12 22l-2.5-7.5L2 12l7.5-2.5z"/>'};
const ic=k=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">${SV[k]}</svg>`;
const sel=$("n");for(let i=1;i<=12;i++)sel.add(new Option(i+" lá",i));sel.value=3;
const rnd=n=>{const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]%n};
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
let drawn=[];

function draw(){
 const n=+sel.value,pool=[...DECK];
 for(let i=pool.length-1;i>0;i--){const j=rnd(i+1);[pool[i],pool[j]]=[pool[j],pool[i]]}
 drawn=pool.slice(0,n).map(c=>({c,r:$("rv").checked&&rnd(2)===1}));
 const pos=n===3?["Quá khứ","Hiện tại","Tương lai"]:n===1?["Thông điệp"]:null;
 $("table").innerHTML=drawn.map((d,i)=>`<div class="slot"><div class="pos">${pos?pos[i]:"Lá "+(i+1)}</div>
 <div class="flip" data-i="${i}"><div class="face back">${ic("maj")}</div>
 <div class="face front ${d.r?"rev":""}"><div class="inner"><div class="ic">${ic(d.c.ic)}</div><div class="nm">${d.c.vn}</div><div class="en">${d.c.en}</div>${d.r?'<div class="tag">NGƯỢC</div>':""}</div></div></div></div>`).join("");
 $("reading").innerHTML="";$("all").style.display="inline-block";
 document.querySelectorAll(".flip").forEach(f=>f.onclick=()=>{f.classList.add("open");show()});
 window._pos=pos;
}
function show(){
 const opened=[...document.querySelectorAll(".flip.open")].map(f=>+f.dataset.i).sort((a,b)=>a-b);
 const q=$("q").value.trim(),t=$("tp").value;
 let h=`<p class="k">Chủ đề: <b>${TPN[t]}</b></p>`+(q?`<p class="k">Câu hỏi: <i>${q.replace(/</g,"&lt;")}</i></p>`:"");
 opened.forEach(i=>{const d=drawn[i],c=d.c,p=window._pos?window._pos[i]:"Lá "+(i+1);
  const ctx=c.maj?`<p class="img">${c.img}</p>`:`<p class="img">${c.img} Bộ ${SUITS[c.suit].vn}: ${SUITS[c.suit].el}. Lá ${RK[c.rank][1]}: ${RT[c.rank]}.</p>`;
  const ex=(c.maj&&!d.r?`<p class="m"><b>Tình cảm:</b> ${c.love}</p><p class="m"><b>Công việc:</b> ${c.work}</p>`:"")+`<p class="m adv"><b>Lời khuyên:</b> ${ADV[c.id][d.r?1:0]}</p>`;
  const body=t==="all"?ctx+`<p class="m on"><b>${d.r?"Nghĩa ngược":"Nghĩa xuôi"}:</b> ${d.r?c.rv:c.up}</p>${ex}`:`<p class="img">${c.img}</p>`+topicText(d,t);
  h+=`<div class="item"><h3>${p}: ${c.vn} ${d.r?"(Ngược)":"(Xuôi)"}</h3><div class="k">${c.en}</div>${body}</div>`});
 if(opened.length===drawn.length)h+=t==="all"?summary():tsum(t);
 $("reading").innerHTML=h;
}
function summary(){
 const n=drawn.length,maj=drawn.filter(d=>d.c.maj).length,rev=drawn.filter(d=>d.r).length;
 const cnt=[0,0,0,0];drawn.forEach(d=>{if(!d.c.maj)cnt[d.c.suit]++});
 const top=Math.max(...cnt);let t=`<b>Tổng quan:</b> `;
 t+=`Có ${maj}/${n} lá thuộc Bộ Ẩn Chính (Đại Bí). `+(maj/n>=0.5?"Nhiều lá lớn cho thấy đây là giai đoạn có ý nghĩa quan trọng, các sự kiện mang tính định hướng cuộc đời. ":maj===0?"Không có lá lớn, vấn đề thiên về chuyện thường ngày, bạn có nhiều quyền chủ động điều chỉnh. ":"");
 if(top>0){const ds=SUITS.map((s,i)=>cnt[i]===top?s:null).filter(Boolean);t+=`Bộ nổi bật: ${ds.map(s=>s.vn+" – "+s.el).join("; ")}. `}
 t+=rev===0?"Toàn bộ lá xuôi: năng lượng khá thông suốt. ":rev===n?"Toàn bộ lá ngược: nhiều điều đang bị chặn hoặc cần nhìn lại từ bên trong. ":`${rev}/${n} lá ngược: những chủ đề đó cần được xử lý hoặc nhìn từ góc khác. `;
 if(window._pos&&n===3)t+=`Mạch chuyện: từ <b>${drawn[0].c.vn}</b> (quá khứ), qua <b>${drawn[1].c.vn}</b> (hiện tại), tới <b>${drawn[2].c.vn}</b> (tương lai).`;
 return `<div class="sum">${t}</div>`;
}
$("go").onclick=draw;
$("tp").onchange=()=>{if($("tp").value==="yn")sel.value=1;if(drawn.length)show()};
$("all").onclick=()=>{document.querySelectorAll(".flip").forEach((f,i)=>setTimeout(()=>{f.classList.add("open");show()},i*250))};
$("lib").innerHTML="<tr><th>Lá bài</th><th>Xuôi</th><th>Ngược</th></tr>"+DECK.map(c=>`<tr><td><span class="li">${ic(c.ic)}</span> ${c.vn}<br><small>${c.en}</small></td><td>${cap(c.up)}</td><td>${cap(c.rv)}</td></tr>`).join("");
</script>
</body>
</html>
